<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B2B25">
  <title>Caso Aberto · Revisão G1</title>
  <meta name="description" content="Jogo de revisão: análise de dados discretos, contínuos e séries temporais.">
  <style>
:root {
  --carvao: #1B2B25;
  --carvao2: #25382F;
  --verde-profundo: #1D5537;
  --verde: #2E8B57;
  --verde-palido: #96BCA5;
  --nevoa: #EAF1EC;
  --ambar: #B86E1B;
  --ambar-claro: #E0983F;
  --ambar-fundo: #FBF1E4;
  --fundo: #F4F2EE;
  --cartao: #FFFFFF;
  --tinta: #1E2A25;
  --suave: #6E6A63;
  --filete: #E2DED7;
  --erro: #A63D32;
  --erro-fundo: #FBEAE7;
  --ok-fundo: #E6F2EA;
  --serifa: Georgia, 'Cambria', 'Times New Roman', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--fundo); color: var(--tinta);
  font-family: var(--sans); font-size: 16px; line-height: 1.45;
  min-height: 100vh;
}
h1, h2, h3 { font-family: var(--serifa); margin: 0 0 .4em; line-height: 1.2; }
p { margin: 0 0 .8em; }
button { font-family: inherit; font-size: 1rem; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- HUD ---------- */
#hud {
  position: sticky; top: 0; z-index: 20;
  background: var(--carvao); color: #fff;
  padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.hud-in { max-width: 1200px; margin: 0 auto; position: relative; }
.hud-l1, .hud-l2 { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.hud-l1 { font-size: .9rem; }
.vidas { font-size: 1.25rem; letter-spacing: 2px; color: #FF7B6B; min-width: 74px; }
.vidas .perdida { color: #5b6a63; }
.vidas .cor { color: #FF7B6B; }
.hud-fase { color: #D6DED8; flex: 1; text-align: center; font-size: .85rem; }
.hud-timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ambar-claro); min-width: 62px; text-align: right; }
.hud-timer.pouco { color: #FF7B6B; }
.hud-l2 { margin-top: 6px; font-size: .78rem; color: #D6DED8; }
.hud-nivel { white-space: nowrap; max-width: 44%; overflow: hidden; text-overflow: ellipsis; }
.xp-barra { flex: 1; height: 9px; background: var(--carvao2); border-radius: 6px; overflow: hidden; }
.xp-barra > div { height: 100%; background: linear-gradient(90deg, var(--verde), var(--ambar-claro)); width: 0; transition: width .6s ease; }
.hud-xp { font-variant-numeric: tabular-nums; font-weight: 700; color: #fff; min-width: 64px; text-align: right; }
.hud-l3 { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 8px; }
.hud-pos { font-size: .74rem; color: var(--verde-palido); }

#pausa {
  position: fixed; inset: 0; z-index: 50; background: rgba(27,43,37,.92); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;
}
#pausa h2 { font-size: 1.8rem; }

/* ---------- layout ---------- */
main { max-width: 1200px; margin: 0 auto; padding: 14px 14px 80px; }
.estreito { max-width: 720px; margin: 0 auto; }
.fim-grade { max-width: 820px; margin: 0 auto; }
.cartao {
  background: var(--cartao); border: 1px solid var(--filete); border-radius: 14px;
  padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(30,42,37,.05);
}
.cartao.escuro { background: var(--carvao); color: #fff; border-color: var(--carvao); }
.cartao.escuro .suave { color: #D6DED8; }
.suave { color: var(--suave); }
.pequeno { font-size: .85rem; }
.centro { text-align: center; }

/* ---------- abertura ---------- */
.capa { text-align: center; padding: 30px 18px 22px; }
.capa .lupa { font-size: 3rem; line-height: 1; }
.capa h1 { font-size: 2rem; margin-top: 8px; }
.capa .sub { color: #D6DED8; margin-top: 4px; }
.selo-caso {
  display: inline-block; margin-top: 12px; padding: 3px 12px; border: 2px solid var(--ambar-claro);
  color: var(--ambar-claro); font-weight: 800; letter-spacing: 3px; font-size: .75rem; border-radius: 4px; transform: rotate(-3deg);
}

/* ---------- formulários ---------- */
label.campo { display: block; margin-bottom: 12px; font-weight: 600; font-size: .92rem; }
label.campo input[type=text], label.campo input[type=email] {
  display: block; width: 100%; margin-top: 4px; padding: 12px; font-size: 1rem;
  border: 1.5px solid var(--filete); border-radius: 10px; background: #fff; color: var(--tinta);
}
label.campo input:focus { outline: 3px solid var(--verde-palido); border-color: var(--verde); }
.turmas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.turma-op { position: relative; }
.turma-op input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.turma-op span {
  display: block; text-align: center; padding: 12px; border: 1.5px solid var(--filete); border-radius: 10px;
  font-weight: 700; background: #fff;
}
.turma-op input:checked + span { border-color: var(--verde-profundo); background: var(--nevoa); color: var(--verde-profundo); }
.turma-op input:focus-visible + span { outline: 3px solid var(--verde-palido); }

.btn {
  display: block; width: 100%; padding: 14px 18px; border: 0; border-radius: 12px;
  background: var(--verde-profundo); color: #fff; font-weight: 700; font-size: 1.05rem;
}
.btn:hover:not(:disabled) { background: var(--verde); }
.btn:disabled { background: #b9c4bd; cursor: not-allowed; }
.btn.ambar { background: var(--ambar); }
.btn.ambar:hover:not(:disabled) { background: #9c5b14; }
.btn.fantasma { background: transparent; color: var(--verde-profundo); border: 1.5px solid var(--verde-profundo); }
.btn.pequeno { width: auto; display: inline-block; padding: 8px 14px; font-size: .9rem; }
.erro-msg { color: var(--erro); background: var(--erro-fundo); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: .92rem; }

/* ---------- temas ---------- */
.tema-card { position: relative; display: block; margin-bottom: 10px; }
.tema-card input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.tema-card .corpo {
  display: flex; gap: 12px; align-items: center; padding: 14px; border: 2px solid var(--filete);
  border-radius: 12px; background: #fff;
}
.tema-card .ico { font-size: 1.8rem; }
.tema-card b { display: block; font-family: var(--serifa); font-size: 1.1rem; }
.tema-card .marca { margin-left: auto; width: 26px; height: 26px; border: 2px solid var(--filete); border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; }
.tema-card input:checked + .corpo { border-color: var(--verde-profundo); background: var(--nevoa); }
.tema-card input:checked + .corpo .marca { background: var(--verde-profundo); border-color: var(--verde-profundo); }
.tema-card input:focus-visible + .corpo { outline: 3px solid var(--verde-palido); }

/* ---------- regras ---------- */
.regras { list-style: none; padding: 0; margin: 0 0 14px; }
.regras li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--filete); font-size: .95rem; }
.regras li:last-child { border-bottom: 0; }
.regras .ic { width: 28px; text-align: center; flex: none; }
.fases-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 14px; }
.fases-mini div { background: var(--nevoa); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: .72rem; }
.fases-mini b { display: block; font-size: .8rem; color: var(--verde-profundo); }

/* ---------- questão ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--nevoa); color: var(--verde-profundo); letter-spacing: .3px; }
.chip.cenario { background: var(--ambar-fundo); color: var(--ambar); }
.chip.fase { background: var(--carvao); color: #fff; }
.caso-box { background: var(--carvao); color: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: .95rem; }
.caso-box b { font-family: var(--serifa); color: var(--ambar-claro); display: block; margin-bottom: 4px; }
.narrativa { font-size: 1rem; background: var(--fundo); border-left: 4px solid var(--verde-palido); padding: 10px 12px; border-radius: 0 8px 8px 0; }
.pergunta { font-size: 1.15rem; margin: 12px 0; }
.alts { display: grid; gap: 9px; margin-bottom: 12px; }
.alt {
  display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%;
  padding: 12px; background: #fff; border: 2px solid var(--filete); border-radius: 12px; color: var(--tinta); line-height: 1.35;
}
.alt .letra {
  flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--nevoa); color: var(--verde-profundo);
  display: grid; place-items: center; font-weight: 800; font-size: .85rem;
}
.alt:hover:not(:disabled) { border-color: var(--verde-palido); }
.alt.sel { border-color: var(--verde-profundo); background: var(--nevoa); }
.alt.sel .letra { background: var(--verde-profundo); color: #fff; }
.alt.eliminada { opacity: .4; text-decoration: line-through; background: #f1eeea; cursor: not-allowed; }
.alt.certa { border-color: var(--verde); background: var(--ok-fundo); }
.alt.certa .letra { background: var(--verde); color: #fff; }
.alt.errada { border-color: var(--erro); background: var(--erro-fundo); }
.alt.errada .letra { background: var(--erro); color: #fff; }
.alt:disabled { cursor: default; }

.pista-box { background: var(--ambar-fundo); border: 1.5px solid var(--ambar); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: .95rem; }
.pista-box b { color: var(--ambar); }

/* ---------- Detetive Mediana ---------- */
.mediana { display: flex; gap: 10px; align-items: flex-start; background: var(--nevoa); border-radius: 12px; padding: 10px; margin-bottom: 12px; }
.mediana svg { flex: none; width: 58px; height: 58px; }
.mediana .balao { position: relative; background: #fff; border-radius: 10px; padding: 8px 10px; font-size: .88rem; flex: 1; }
.mediana .balao::before { content: ''; position: absolute; left: -7px; top: 14px; border: 7px solid transparent; border-right-color: #fff; border-left: 0; }
.mediana .balao b { color: var(--verde-profundo); }
.ajudas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.ajuda-btn { padding: 8px 6px; border: 1.5px solid var(--ambar); background: #fff; color: var(--ambar); border-radius: 10px; font-weight: 700; font-size: .8rem; line-height: 1.2; }
.ajuda-btn small { display: block; font-weight: 600; color: var(--suave); }
.ajuda-btn:disabled { border-color: var(--filete); color: #aaa; background: #f6f4f1; cursor: not-allowed; }

/* ---------- gráfico e tabela ---------- */
figure.grafico { margin: 10px 0; background: #fff; border: 1px solid var(--filete); border-radius: 10px; padding: 8px 6px 4px; }
figure.grafico figcaption { font-size: .8rem; font-weight: 700; color: var(--suave); padding: 0 6px 2px; }
figure.grafico svg { display: block; width: 100%; height: auto; }
.tabela-wrap { overflow-x: auto; margin: 10px 0; }
table.tabela { border-collapse: collapse; width: 100%; font-size: .9rem; background: #fff; }
.tabela th { background: var(--fundo); text-align: left; padding: 7px 9px; border-bottom: 2px solid var(--verde-profundo); color: var(--verde-profundo); font-size: .82rem; }
.tabela td { padding: 7px 9px; border-bottom: 1px solid var(--filete); }
.tabela td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabela tr.total td { font-weight: 800; background: var(--fundo); }

/* ---------- feedback ---------- */
.veredito { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.veredito .carimbo {
  font-weight: 900; letter-spacing: 2px; font-size: .9rem; padding: 6px 12px; border: 3px double; border-radius: 6px; transform: rotate(-4deg);
}
.veredito.ok .carimbo { color: var(--verde-profundo); border-color: var(--verde-profundo); }
.veredito.erro .carimbo { color: var(--erro); border-color: var(--erro); }
.explicacao { background: var(--fundo); border-radius: 10px; padding: 12px; margin: 12px 0; }
.explicacao h3 { font-size: 1rem; color: var(--verde-profundo); }
.xp-detalhe { list-style: none; padding: 0; margin: 0 0 12px; font-size: .92rem; }
.xp-detalhe li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--filete); }
.xp-detalhe li.total { font-weight: 800; border-bottom: 0; border-top: 2px solid var(--tinta); margin-top: 4px; padding-top: 6px; }
.pos { color: var(--verde-profundo); font-weight: 700; }
.neg { color: var(--erro); font-weight: 700; }
.nivel-up { background: linear-gradient(90deg, var(--ambar-fundo), #fff); border: 2px solid var(--ambar); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-weight: 700; text-align: center; animation: pulsa 1.2s ease 2; }
@keyframes pulsa { 50% { transform: scale(1.03); } }

/* ---------- fim ---------- */
.placar-final { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: var(--fundo); border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat b { display: block; font-size: 1.35rem; font-family: var(--serifa); color: var(--verde-profundo); }
.stat span { font-size: .72rem; color: var(--suave); }
.conceito { margin: 8px 0; font-size: .9rem; }
.conceito .linha { display: flex; justify-content: space-between; gap: 8px; }
.conceito .trilho { height: 8px; background: var(--filete); border-radius: 6px; overflow: hidden; margin-top: 3px; }
.conceito .trilho > div { height: 100%; background: var(--verde); }
.conceito.fraco .trilho > div { background: var(--ambar); }
.conceito .rev { font-size: .76rem; color: var(--ambar); font-weight: 700; }
details.erro-item { border: 1px solid var(--filete); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: #fff; }
details.erro-item summary { cursor: pointer; font-weight: 600; font-size: .92rem; }
details.erro-item .corpo { padding-top: 8px; font-size: .9rem; }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--carvao); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 60; max-width: 90%; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

@media (min-width: 640px) {
  .capa h1 { font-size: 2.4rem; }
  .alt { padding: 14px; }
}

/* =====================================================================
   PAINEL DO PROFESSOR
   ===================================================================== */
body.prof { background: #EEF1EE; }
.prof-topo { background: var(--carvao); color: #fff; padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.prof-topo h1 { font-size: 1.3rem; margin: 0; }
.prof-wrap { max-width: 1400px; margin: 0 auto; padding: 14px; }
.prof-grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.prof-grid > section { background: #fff; border: 1px solid var(--filete); border-radius: 12px; padding: 14px; }
.prof-grid h2 { font-size: 1.05rem; color: var(--verde-profundo); margin-bottom: 10px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c6 { grid-column: span 6; } .c4 { grid-column: span 4; }
@media (max-width: 1000px) { .c8, .c6, .c4 { grid-column: span 12; } }
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controles input[type=number] { width: 70px; padding: 8px; border: 1.5px solid var(--filete); border-radius: 8px; font-size: 1rem; }
.b { padding: 9px 14px; border: 0; border-radius: 8px; font-weight: 700; background: var(--verde-profundo); color: #fff; }
.b.am { background: var(--ambar); } .b.vm { background: var(--erro); } .b.cz { background: #6E6A63; } .b.cl { background: #fff; color: var(--verde-profundo); border: 1.5px solid var(--verde-profundo); }
.b:disabled { opacity: .4; cursor: not-allowed; }
.relogio { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ambar-claro); }
.contadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.cont { background: var(--fundo); border-radius: 10px; padding: 8px; text-align: center; }
.cont b { display: block; font-size: 1.6rem; font-family: var(--serifa); color: var(--verde-profundo); }
.cont span { font-size: .74rem; color: var(--suave); }
.linkbox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.linkbox .url { font-size: 1.15rem; font-weight: 800; color: var(--verde-profundo); word-break: break-all; }
#qr { background: #fff; padding: 6px; border: 1px solid var(--filete); border-radius: 8px; }
.tabela-rank { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tabela-rank th { text-align: left; padding: 6px 8px; background: var(--fundo); border-bottom: 2px solid var(--verde-profundo); position: sticky; top: 0; cursor: pointer; white-space: nowrap; font-size: .78rem; }
.tabela-rank td { padding: 6px 8px; border-bottom: 1px solid var(--filete); white-space: nowrap; }
.tabela-rank tr:hover td { background: var(--nevoa); cursor: pointer; }
.tabela-rank .num { text-align: right; font-variant-numeric: tabular-nums; }
.rolagem { max-height: 520px; overflow: auto; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .72rem; font-weight: 700; }
.badge.jogando { background: #DCEFE3; color: var(--verde-profundo); }
.badge.vitoria { background: var(--verde-profundo); color: #fff; }
.badge.gameover { background: var(--erro-fundo); color: var(--erro); }
.badge.tempo { background: #eee; color: #555; }
.badge.pronto, .badge.cadastrado { background: var(--ambar-fundo); color: var(--ambar); }
.vida { color: #E0554A; }
.filtros { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.filtros button { padding: 5px 12px; border-radius: 99px; border: 1.5px solid var(--verde-profundo); background: #fff; color: var(--verde-profundo); font-weight: 700; font-size: .82rem; }
.filtros button.on { background: var(--verde-profundo); color: #fff; }
.mapa-calor { width: 100%; border-collapse: collapse; font-size: .85rem; }
.mapa-calor th, .mapa-calor td { padding: 8px; text-align: center; border: 2px solid #fff; }
.mapa-calor th { background: var(--fundo); font-size: .78rem; }
.mapa-calor td.t { text-align: left; background: var(--fundo); font-weight: 700; }
.barra-h { margin: 6px 0; font-size: .84rem; }
.barra-h .top { display: flex; justify-content: space-between; gap: 8px; }
.barra-h .tr { height: 12px; background: var(--filete); border-radius: 6px; overflow: hidden; margin-top: 2px; }
.barra-h .tr > div { height: 100%; }
.q-dificil { border: 1px solid var(--filete); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: .88rem; }
.q-dificil .alt-d { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.q-dificil .alt-d.certa { color: var(--verde-profundo); font-weight: 700; }
.hist { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
.hist > div { flex: 1; background: var(--verde); border-radius: 3px 3px 0 0; position: relative; min-height: 2px; }
.hist > div span { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: .72rem; color: var(--tinta); }
.hist-leg { display: flex; gap: 4px; font-size: .68rem; color: var(--suave); }
.hist-leg > div { flex: 1; text-align: center; }
dialog { border: 0; border-radius: 14px; padding: 18px; max-width: 760px; width: 94%; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(27,43,37,.6); }

/* telão */
body.telao { background: var(--carvao); color: #fff; }
.telao-wrap { max-width: 1500px; margin: 0 auto; padding: 22px 30px; }
.telao-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 20px; }
.telao-topo h1 { font-size: 2.6rem; color: #fff; margin: 0; }
.telao-topo .relogio { font-size: 3.4rem; }
.telao-linha { display: grid; grid-template-columns: 70px 1fr 120px 280px 150px; gap: 14px; align-items: center; padding: 10px 18px; margin-bottom: 8px; background: var(--carvao2); border-radius: 12px; font-size: 1.7rem; }
.telao-linha.p1 { background: linear-gradient(90deg, #6b4a12, var(--carvao2)); border: 2px solid var(--ambar-claro); }
.telao-linha .pos { color: var(--ambar-claro); font-weight: 900; font-size: 2rem; }
.telao-linha .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.telao-linha .tm, .telao-linha .nv { font-size: 1.1rem; color: #D6DED8; }
.telao-linha .xp { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--ambar-claro); }

  <div id="toast" role="status"></div>

  <script>
/* Mini-biblioteca de gráficos em SVG para as questões do jogo.
   Paleta das aulas: destaque contra contexto (verde profundo x verde pálido), âmbar para referências.

   Graficos.render(v, op)
     v  = especificação do gráfico (tipo, rotulos, valores, ...)

        var viz = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(function (d) { return { r: r + d[0], c: c + d[1] }; })

    pertoMediana = mediana && Math.abs(mediana.r - pos.r) + Math.abs(mediana.c - pos.c) === 1;

    n: t.n,
    status: t.status,
    etapa: t.etapa,
    vidas: t.vidas,
    xp: t.xp,
    streak: t.streak,
    nivel: nivelDe(t.xp),

    idx: t.idx,

  const porConceito = {};

    const q = banco.porId.get(r.qid);

    nivel: nivelDe(t.xp),
    acertos: t.respostas.filter((r) => r.acertou).length,
    respondidas: t.respostas.length,

'use strict';
// Banco de questões INTERATIVAS (os três temas).
// Tipos: classificar (cartões em caixas), ordenar, marcador (arrastar linha no gráfico),
// pontos (tocar em barras/pontos), construir (montar um gráfico) e multipla (marque todas).

const HIST50 = {
  rotulos: ['<50', '50-100', '100-150', '150-200', '200-250', '250-300', '300-350', '350-400', '400-450', '450-500', '500+'],
  valores: [0.5, 25.9, 20.3, 17.9, 10.8, 8.7, 8.0, 4.2, 0.7, 0.3, 2.7],
};

// Histograma com faixas de R$ 10: mesma distribuição, mas cheio de "dentes" (preços de cardápio).
function serrote() {
  const rot = [];
  const val = [];
  HIST50.valores.forEach((v, b) => {
    const pesos = [0, 1, 2, 3, 4].map((k) => 1 + 0.85 * Math.sin(k * 2.3 + b * 1.7));
    const soma = pesos.reduce((a, c) => a + c, 0);
    pesos.forEach((p, k) => {
      rot.push(String(b * 50 + k * 10));
      val.push(Math.round((v * p / soma) * 100) / 100);
    });
  });
  const dif = Math.round((100 - val.reduce((a, c) => a + c, 0)) * 100) / 100;
  val[val.indexOf(Math.max(...val))] = Math.round((Math.max(...val) + dif) * 100) / 100;
  return { rotulos: rot, valores: val };
}

  function resolver(de, alvo) {
    var partes = de.split('/').slice(0, -1);

    return partes.join('/');
  }
  function carregar(nome) {
    if (cache[nome]) return cache[nome].exports;
    if (!fontes[nome]) throw new Error('Módulo não encontrado: ' + nome);
    var m = { exports: {} };
    cache[nome] = m;
    fontes[nome](m, m.exports, function (alvo) { return carregar(resolver(nome, alvo)); });
    return m.exports;
  }
  return carregar;

  <script>
/* Backend local para a versão offline (um único HTML, sem servidor).
   Responde às mesmas rotas do servidor usando o mesmo motor de regras, e salva o progresso no localStorage.
   Depende de __req(), o carregador de módulos gerado por scripts/gerar-revisao.js. */
(function () {
  'use strict';
  var motor = __req('lib/motor');
  var banco = __req('lib/banco');
  var tipos = __req('lib/tipos');
  var est = __req('lib/estatisticas');
  var CHAVE = 'caso_aberto_revisao_g1';
  var MAX_TENTATIVAS = 25;

  var aluno = null;
  try { aluno = JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { aluno = null; }
  if (aluno && (!Array.isArray(aluno.tentativas) || !aluno.nome)) aluno = null;

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(aluno)); } catch (e) { /* modo privado: segue sem salvar */ }
  }

  function erro(msg, status) { var e = new Error(msg); e.status = status || 409; return e; }

  function ultima() { return aluno && aluno.tentativas.length ? aluno.tentativas[aluno.tentativas.length - 1] : null; }

  function recorde() { return Math.max(aluno.recorde || 0, est.melhorDe(aluno).xp); }

  function estado() {
    var t = ultima();
    return {
      rodada: { status: 'ativa', restanteMs: null, duracaoMin: 0 },
      aluno: { nome: aluno.nome, turma: '', ra: '', temas: aluno.temas, tentativas: aluno.tentativas.length },
      melhorXp: recorde(),
      posicao: null,
      totalAlunos: 0,
      tentativa: t ? motor.tentativaPublica(t) : null,
    };
  }

  function config() {
    return {
      local: true,
      subtitulo: 'Revisão para a G1 · treino individual',
      turmas: [],
      temas: banco.TEMAS,
      fases: motor.FASES,
      niveis: motor.NIVEIS,
      vidas: motor.VIDAS,
      custo: motor.CUSTO,
      bonus: { fase: motor.BONUS_FASE, vida: motor.BONUS_VIDA, seq: motor.BONUS_SEQ, seqMax: motor.SEQ_MAX, item: motor.BONUS_ITEM },
      tipos: tipos.NOMES,
      total: motor.TOTAL,
      totalQuestoes: banco.porId.size,
    };
  }

  function tratar(caminho, c) {
    c = c || {};
    if (caminho === '/api/config') return config();
    if (caminho === '/api/entrar') {
      var nome = String(c.nome || '').trim().replace(/\s+/g, ' ');
      if (nome.length < 2 || nome.length > 40) throw erro('Digite um nome com pelo menos 2 letras.');
      if (!aluno || aluno.nome !== nome) aluno = { id: 'local', nome: nome, temas: [], tentativas: [], recorde: 0, criadoEm: Date.now(), ultimaAtividade: Date.now() };
      salvar();
      return { token: 'local' };
    }
    if (!aluno) throw erro('Comece preenchendo seu nome.', 401);
    if (caminho.indexOf('/api/estado') === 0) return estado();
    if (caminho === '/api/temas') {
      var temas = Array.isArray(c.temas) ? c.temas.filter(function (t, i, a) { return banco.TEMAS[t] && a.indexOf(t) === i; }) : [];
      if (!temas.length) throw erro('Escolha pelo menos um conteúdo.');
      var t0 = ultima();
      if (t0 && t0.status === 'jogando') throw erro('Termine a tentativa atual antes de trocar os conteúdos.');
      aluno.temas = temas;
      salvar();
      return estado();
    }
    if (caminho === '/api/iniciar') {
      if (!aluno.temas.length) throw erro('Escolha os conteúdos primeiro.');
      var at = ultima();
      if (!at || at.status !== 'jogando') {
        aluno.recorde = recorde();
        aluno.tentativas.push(motor.criarTentativa(aluno));
        if (aluno.tentativas.length > MAX_TENTATIVAS) aluno.tentativas = aluno.tentativas.slice(-MAX_TENTATIVAS);
        salvar();
      }
      return estado();
    }
    var t = ultima();
    if (!t) throw erro('Nenhuma tentativa em andamento.');
    var r;
    if (caminho === '/api/responder') motor.responder(t, c.resposta);
    else if (caminho === '/api/ajuda') motor.usarAjuda(t, c.tipo);
    else if (caminho === '/api/proxima') motor.proxima(t);
    else if (caminho === '/api/abrir') motor.abrir(t, String(c.qid || ''));
    else if (caminho === '/api/bonus') r = motor.coletarBonus(t, String(c.id || ''));
    else throw erro('Ação desconhecida.', 404);
    aluno.ultimaAtividade = Date.now();
    salvar();
    var s = estado();
    if (r !== undefined) s.ganhoBonus = r;
    return s;
  }

  window.CasoLocal = {
    api: function (caminho, corpo) {
      return new Promise(function (ok, falha) {
        try { ok(JSON.parse(JSON.stringify(tratar(caminho, corpo)))); } catch (e) { if (!e.status) e.status = e.http || 500; falha(e); }
      });
    },
    token: function () { return aluno ? 'local' : null; },
    apagar: function () { aluno = null; try { localStorage.removeItem(CHAVE); } catch (e) { /* ignore */ } },
  };
})();

</script>

    'Um bom detetive confere o denominador antes de confiar no percentual.',
    'Não se deixe levar pelo gráfico bonito: olhe o eixo e a escala.',
    'O importante é o raciocínio, não a fórmula.',
    'Se a conclusão parece boa demais, procure o que os dados não mostram.',
    'Variável ordinal tem ordem natural. Nominal, não. Isso muda o gráfico!',
    'Série temporal se lê na ordem do tempo. E mês incompleto engana.',
    'Previsão sem erro esperado é chute disfarçado de certeza.',
    'Comparar grupos de tamanhos diferentes? Use proporções.',
    'Percentis transformam "cobrir 90% dos casos" num número concreto.',
    'Os itens brilhando pelo chão valem XP extra. Só não esqueça as pistas!',
  ];
  var ICO_TIPO = { escolha: '📝', multipla: '☑️', classificar: '🗂️', ordenar: '↕️', marcador: '↔️', pontos: '👆', construir: '🛠️' };
  var ICO_ESTADO = { pendente: '🔍', aberta: '📂', certa: '✅', errada: '❌', bloqueada: '🔒' };

  // ---------------------------------------------------------------- utilidades
  function toast(msg, tipo) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = tipo || '';
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.style.display = 'none'; }, 3800);
  }

  function api(caminho, corpo) {
    if (window.CasoLocal) return window.CasoLocal.api(caminho, corpo);
    var opts = corpo === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) };
    return fetch(caminho, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.erro || 'Falha de comunicação com o servidor.'); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function guardarEstado(j) { S = j; recebidoEm = Date.now(); }
  function atualizar() { return api('/api/estado?token=' + encodeURIComponent(TOKEN)).then(guardarEstado); }

  function sair() {
    TOKEN = null; S = null; tela = '';
    try { localStorage.removeItem('caso_token'); } catch (e) { /* ignore */ }
    renderizar(true);
  }

  function agir(fn) {
    if (ocupado) return Promise.resolve();
    ocupado = true;
    if (mapa) mapa.ativar(false);
    return fn().then(function () { ocupado = false; renderizar(); }).catch(function (e) {
      ocupado = false;
      if (e.status === 401) { sair(); toast(e.message); return; }
      Sons.tocar('bloqueado');
      toast(e.message, 'erro');
      return atualizar().then(function () { renderizar(); }).catch(function () { renderizar(); });
    });
  }

  function post(caminho, extra) {
    return function () {
      var corpo = { token: TOKEN };
      Object.keys(extra || {}).forEach(function (k) { corpo[k] = extra[k]; });
      return api(caminho, corpo).then(guardarEstado);
    };
  }

  function nivelDe(xp) {
    var niveis = CFG.niveis, i = 0;
    niveis.forEach(function (n, k) { if (xp >= n.min) i = k; });
    var a = niveis[i], p = niveis[i + 1];
    return { nome: a.nome, pct: p ? Math.min(100, Math.round(((xp - a.min) / (p.min - a.min)) * 100)) : 100 };
  }

  function fmtTempo(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function restanteAgora() {
    if (!S || S.rodada.restanteMs === null) return null;
    if (S.rodada.status === 'ativa') return S.rodada.restanteMs - (Date.now() - recebidoEm);
    return S.rodada.restanteMs;
  }

  function xpFlutuante(txt, cls) {
    var d = document.createElement('div');
    d.className = 'xp-flutua ' + (cls || '');
    d.textContent = txt;
    $('#hud').appendChild(d);
    setTimeout(function () { d.remove(); }, 1600);
  }

  // ---------------------------------------------------------------- HUD
  function atualizarHud() {
    var hud = $('#hud');
    if (!TOKEN || !S) { hud.hidden = true; $('#pausa').hidden = true; document.documentElement.style.setProperty('--hud-h', '0px'); return; }
    hud.hidden = false;
    document.documentElement.style.setProperty('--hud-h', hud.offsetHeight + 'px');
    var t = S.tentativa;
    var vidas = t ? t.vidas : CFG.vidas;
    var h = '';
    for (var i = 0; i < CFG.vidas; i++) h += i < vidas ? '<span class="cor">♥</span>' : '<span class="perdida">♥</span>';
    var hv = $('#hud-vidas');
    hv.innerHTML = h;
    if (vidasAntes !== null && t && vidas < vidasAntes) { hv.classList.remove('treme'); void hv.offsetWidth; hv.classList.add('treme'); }
    vidasAntes = t ? vidas : null;
    var xp = t ? t.xp : S.melhorXp;
    var nv = t ? t.nivel : nivelDe(xp);
    if (xpAntes !== null && t && xp !== xpAntes) xpFlutuante((xp > xpAntes ? '+' : '−') + Math.abs(xp - xpAntes) + ' XP', xp > xpAntes ? '' : 'neg');
    xpAntes = t ? xp : null;
    $('#hud-nivel').textContent = nv.nome;
    $('#hud-barra').style.width = nv.pct + '%';
    $('#hud-xp').textContent = xp.toLocaleString('pt-BR') + ' XP';
    var fase = 'Aquecimento';
    if (t && t.etapa !== 'fim') fase = 'Fase ' + t.fase.n + ' · ' + t.fase.nome + ' · ' + t.respondidas + '/' + t.total;
    else if (t) fase = 'Resultado da tentativa ' + t.n;
    $('#hud-fase').textContent = fase;
    var rest = restanteAgora();
    var tm = $('#hud-timer');
    if (S.rodada.status === 'ativa' && rest !== null) {
      tm.textContent = '⏱ ' + fmtTempo(rest);
      tm.classList.toggle('pouco', rest < 5 * 60000);
      var seg = Math.ceil(rest / 1000);
      if (t && t.status === 'jogando' && seg !== ultimoTique && seg > 0 && (seg <= 10 || (seg <= 60 && seg % 15 === 0))) { ultimoTique = seg; Sons.tocar(seg <= 10 ? 'tique' : 'alerta'); }
    } else if (S.rodada.status === 'pausada') { tm.textContent = '⏸ ' + fmtTempo(rest || 0); tm.classList.remove('pouco'); }
    else if (S.rodada.status === 'encerrada') tm.textContent = 'Encerrada';
    else tm.textContent = '';
    $('#hud-pos').textContent = CFG.local ? 'Seu recorde: ' + S.melhorXp.toLocaleString('pt-BR') + ' XP' : S.posicao ? S.posicao + 'º de ' + S.totalAlunos + ' · melhor: ' + S.melhorXp.toLocaleString('pt-BR') + ' XP' : '';
    var pausado = S.rodada.status === 'pausada' && t && t.status === 'jogando';
    $('#pausa').hidden = !pausado;
    var est = Sons.estado();
    $('#btn-som').textContent = est.som ? '🔊' : '🔇';
    $('#btn-musica').classList.toggle('desligado', !est.musica);
  }

  $('#btn-som').addEventListener('click', function () { Sons.alternarSom(); atualizarHud(); });
  $('#btn-musica').addEventListener('click', function () { var on = Sons.alternarMusica(); toast(on ? '🎵 Trilha ligada' : 'Trilha desligada'); atualizarHud(); });
  document.addEventListener('pointerdown', function () { Sons.desbloquear(); }, { once: true });
  document.addEventListener('keydown', function () { Sons.desbloquear(); }, { once: true });

  // ---------------------------------------------------------------- telas
  function qualTela() {
    if (!TOKEN || !S) return 'cadastro';
    if (forcarTemas || !S.aluno.temas.length) return 'temas';
    var t = S.tentativa;
    if (!t) return 'briefing:' + S.rodada.status;
    if (t.etapa === 'fim') return 'fim:' + t.n + ':' + t.status + ':' + S.rodada.status;
    if (t.etapa === 'transicao') return 'transicao:' + t.n + ':' + t.transicao.proxima.n;
    return 'jogo:' + t.n + ':' + t.mapa.fase;
  }

  function renderizar(forcar) {
    atualizarHud();
    var k = qualTela();
    if (forcar || k !== tela) {
      var tipo = k.split(':')[0];
      if (tipo !== 'jogo') desmontarJogo();
      tela = k;
      var fn = { cadastro: telaCadastro, temas: telaTemas, briefing: telaBriefing, jogo: telaJogo, transicao: telaTransicao, fim: telaFim }[tipo];
      if (fn) fn();
      window.scrollTo(0, 0);
    }
    if (tela.indexOf('jogo:') === 0) sincronizarJogo();
  }

  function capa(sub) {
    return '<section class="cartao escuro capa"><div class="lupa">🕵️</div><h1>Caso Aberto</h1><div class="sub">' + sub + '</div><div class="selo-caso">CONFIDENCIAL</div></section>';
  }

  function telaCadastro() {
    if (CFG.local) return telaCadastroLocal();
    app.innerHTML = '<div class="estreito">' + capa('Detetives de Dados · revisão para a prova') +
      '<form id="form" class="cartao" autocomplete="on">' +
      '<h2>Ficha do(a) detetive</h2><div id="erro"></div>' +

      '<label class="campo">E-mail<input type="email" name="email" autocomplete="email" inputmode="email" required maxlength="120"></label>' +
      '<label class="campo">Registro Acadêmico (RA)<input type="text" name="ra" autocomplete="off" required maxlength="20"></label>' +
      '<div class="campo" style="font-weight:600;font-size:.92rem;margin-bottom:6px">Turma</div>' +
      '<div class="turmas">' + CFG.turmas.map(function (t) {

    $('#form').addEventListener('submit', function (ev) {
      ev.preventDefault();

      Sons.tocar('clique');
      api('/api/entrar', { nome: f.nome.value, email: f.email.value, ra: f.ra.value, turma: f.turma.value || '' }).then(function (j) {
        TOKEN = j.token;
        try { localStorage.setItem('caso_token', TOKEN); } catch (e) { /* ignore */ }
        return atualizar();
      }).then(function () { ocupado = false; Sons.tocar('abrir'); renderizar(true); })
        .catch(function (e) { ocupado = false; Sons.tocar('bloqueado'); $('#erro').innerHTML = '<div class="erro-msg">' + E(e.message) + '</div>'; });

  function telaCadastroLocal() {
    app.innerHTML = '<div class="estreito">' + capa(E(CFG.subtitulo || 'Detetives de Dados · treino para a prova')) +
      '<form id="form" class="cartao" autocomplete="on">' +
      '<h2>Ficha do(a) detetive</h2><div id="erro"></div>' +

  // ---- 2. conteúdos
  function telaTemas() {
    var atuais = (S && S.aluno.temas) || [];
    var cards = Object.keys(CFG.temas).map(function (k) {
      var t = CFG.temas[k];
      return '<label class="tema-card"><input type="checkbox" value="' + k + '"' + (atuais.indexOf(k) >= 0 ? ' checked' : '') + '>' +
        '<div class="corpo"><span class="ico">' + t.icone + '</span><div><b>' + E(t.nome) + '</b><span class="suave pequeno">' + E(t.aula) + '</span></div><span class="marca">✓</span></div></label>';
    }).join('');
    app.innerHTML = '<div class="estreito">' + capa('Olá, ' + E(S.aluno.nome.split(' ')[0]) + '!') +
      '<section class="cartao"><h2>O que você quer revisar?</h2><p class="suave">Escolha um ou mais conteúdos. As pistas serão sorteadas entre eles.</p>' +
      '<div id="erro"></div>' + cards + '<button class="btn" id="seguir">Continuar</button></section></div>';
    app.querySelectorAll('.tema-card input').forEach(function (i) { i.addEventListener('change', function () { Sons.tocar('selecionar'); }); });
    $('#seguir').addEventListener('click', function () {
      var temas = Array.prototype.map.call(document.querySelectorAll('.tema-card input:checked'), function (i) { return i.value; });
      if (!temas.length) { Sons.tocar('bloqueado'); $('#erro').innerHTML = '<div class="erro-msg">Escolha pelo menos um conteúdo.</div>'; return; }
      agir(function () { return api('/api/temas', { token: TOKEN, temas: temas }).then(function (j) { guardarEstado(j); forcarTemas = false; }); });

  // ---- 3. briefing / sala de espera
  function regrasHtml() {
    var f = CFG.fases, c = CFG.custo;
    return '<ul class="regras">' +
      '<li><span class="ic">🚶</span><span><b>Ande pelo cenário</b> com as setas/WASD, clicando numa casa ou pelo direcional na tela. Pise numa <b>🔍 pista</b> para abri-la, na ordem que quiser.</span></li>' +
      '<li><span class="ic">🛠️</span><span>Além de alternativas, há pistas para <b>montar gráficos</b>, <b>arrastar marcadores</b>, <b>tocar no gráfico</b>, <b>classificar cartões</b> e <b>ordenar</b>.</span></li>' +

      '<li><span class="ic">🕵️</span><span><b>Detetive Mediana</b>: encoste nela no mapa para uma dica grátis. Dentro da pista, ela ajuda, mas cobra: <b>pista</b> −' + Math.round(c.pista * 100) + '% do XP da questão; <b>revelar</b> −' + Math.round(c.revelar * 100) + '%.</span></li>' +
      '<li><span class="ic">🔊</span><span>Tem som! Use 🔊 e 🎵 no topo para ligar ou desligar efeitos e trilha.</span></li>' +

  function telaBriefing() {

    var msg = { espera: 'Aguardando o professor abrir o caso…', ativa: '', pausada: 'A rodada está pausada pelo professor.', encerrada: 'A rodada foi encerrada pelo professor.' }[st];
    var temas = S.aluno.temas.map(function (k) { return CFG.temas[k].icone + ' ' + CFG.temas[k].nome; }).join(' · ');
    app.innerHTML = '<div class="estreito">' + capa('Dossiê de ' + E(S.aluno.nome.split(' ')[0]) + (S.aluno.turma ? ' · ' + E(S.aluno.turma) : '')) +
      '<section class="cartao"><h2>Como funciona o caso</h2>' + regrasHtml() +

    $('#trocar').addEventListener('click', function (ev) { ev.preventDefault(); forcarTemas = true; renderizar(true); });

    fecharModal();

    app.innerHTML = '<div class="jogo">' +
      '<div class="palco"><div class="cena-cab"><span class="cena-fase">Fase ' + t.fase.n + ' · ' + E(t.fase.nome) + '</span><b>' + E(cena.nome) + '</b> <span class="suave">· ' + E(cena.local) + '</span></div>' +

      '<section class="cartao controles-info pequeno"><b>Controles</b><br>⌨️ Setas ou WASD · 🖱️ clique numa casa · 📱 toque no mapa ou use o direcional.<br>🧀 Itens bônus valem +' + CFG.bonus.item + ' XP.</section>' +

          guardarEstado(j);

          renderizar();
        }).catch(function () { /* ignora */ });
      },
      aoMediana: function () {
        var pend = S.tentativa.mapa.pistas.filter(function (p) { return p.estado === 'pendente'; }).length;

        var el = $('#fala-mediana');

    });
    // direcional: segurar para continuar andando

  function sincronizarJogo() {
    var t = S.tentativa;
    if (!t || !t.mapa || !mapa) return;
    mapa.atualizar(t.mapa.pistas, t.mapa.bonus);
    desenharListaPistas(t);
    var chave = '';
    if (t.etapa === 'pergunta') chave = 'p:' + t.questao.id + ':' + JSON.stringify(t.questao.revelado);
    else if (t.etapa === 'feedback') chave = 'f:' + t.questao.id;
    if (chave !== modalChave) {
      modalChave = chave;
      if (!chave) fecharModal();
      else if (t.etapa === 'pergunta') abrirPergunta(t);
      else abrirFeedback(t);
    } else if (t.etapa === 'pergunta') {
      atualizarPista(t.questao);
    }
    var livre = t.etapa === 'mapa' && t.status === 'jogando' && S.rodada.status === 'ativa' && !ocupado;
    mapa.ativar(livre);
  }

  // ---- janela modal
  function abrirModal(html) {
    modalCorpo.innerHTML = html;
    if (modal.hidden) {
      modal.hidden = false;
      document.body.classList.add('com-modal');
      modal.classList.remove('entra'); void modal.offsetWidth; modal.classList.add('entra');
    }
    modal.querySelector('.modal-caixa').scrollTop = 0;
  }
  function fecharModal() {
    modal.hidden = true;
    modalCorpo.innerHTML = '';
    document.body.classList.remove('com-modal');
    modalChave = '';
    controle = null;
  }

  function cabecalhoQuestao(q, t) {
    var tema = CFG.temas[q.tema];
    var h = '<div class="chips"><span class="chip fase">Fase ' + q.fase + '</span><span class="chip">' + tema.icone + ' ' + E(tema.nome) + '</span>' +
      (q.cenario ? '<span class="chip cenario">' + E(q.cenario) + '</span>' : '') +
      '<span class="chip tipo">' + ICO_TIPO[q.tipo] + ' ' + E(CFG.tipos[q.tipo]) + '</span></div>';
    if (q.caso) h += '<div class="caso-box"><b>🗂️ ' + E(q.caso.titulo) + ' · pergunta ' + q.caso.parte + ' de ' + q.caso.partes + '</b>' + E(q.caso.narrativa) + (q.caso.visual && q.caso.parte === 1 ? Graficos.render(q.caso.visual) : '') + '</div>';
    if (q.narrativa) h += '<p class="narrativa">' + E(q.narrativa) + '</p>';
    if (q.visual && q.tipo !== 'marcador' && q.tipo !== 'pontos') h += Graficos.render(q.visual);
    return h;
  }

  function abrirPergunta(t) {
    var q = t.questao;
    var h = '<div class="modal-topo"><span>📂 Pista aberta</span><span class="suave">' + E(Mapa.CENAS[t.mapa.fase].nome) + '</span></div>' +
      cabecalhoQuestao(q, t) +
      '<h2 class="pergunta">' + E(q.pergunta) + '</h2>' +
      '<div id="resposta"></div>' +
      '<div id="pista-box"></div>' +
      '<div class="mediana ajuda-mediana">' + Mapa.SVG_MEDIANA + '<div style="flex:1"><div class="balao"><b>Detetive Mediana:</b> Travou? Posso ajudar, mas meu tempo custa XP.</div>' +
      '<div class="ajudas"><button class="ajuda-btn" id="ajuda-pista">💡 Pista<small>−' + q.ajudas.pista + ' XP</small></button>' +
      '<button class="ajuda-btn" id="ajuda-revelar">✨ ' + E(q.ajudas.rotuloRevelar) + '<small>−' + q.ajudas.revelar + ' XP</small></button></div></div></div>' +
      '<div class="barra-confirmar"><button class="btn" id="confirmar" disabled>Confirmar resposta</button></div>';
    abrirModal(h);
    controle = Interativos.montar($('#resposta'), q, function () { $('#confirmar').disabled = !controle.completo(); });
    $('#confirmar').disabled = !controle.completo();
    atualizarPista(q);
    $('#confirmar').addEventListener('click', confirmar);
    $('#ajuda-pista').addEventListener('click', function () { Sons.tocar('ajuda'); agir(post('/api/ajuda', { tipo: 'pista' })); });
    $('#ajuda-revelar').addEventListener('click', function () {
      if (q.tipo !== 'escolha' && q.tipo !== 'multipla' && !confirm('Revelar reorganiza a questão e desfaz o que você já marcou. Continuar?')) return;
      Sons.tocar('ajuda');
      agir(post('/api/ajuda', { tipo: 'revelar' }));
    });
  }

  function atualizarPista(q) {
    var box = $('#pista-box');
    if (!box) return;
    if (q.pista && !box.innerHTML) box.innerHTML = '<div class="pista-box"><b>💡 Pista da Detetive Mediana:</b> ' + E(q.pista) + '</div>';
    var bp = $('#ajuda-pista'), br = $('#ajuda-revelar');
    if (bp) bp.disabled = !!q.pista;
    if (br) br.disabled = !!q.revelado;
  }

  function confirmar() {
    if (!controle || !controle.completo()) return;
    var resposta = controle.valor();
    agir(post('/api/responder', { resposta: resposta })).then(function () {
      var t = S && S.tentativa;
      if (!t || !t.pendente) return;
      Sons.tocar(t.pendente.acertou ? 'certo' : 'errado');
      if (t.pendente.subiuNivel) setTimeout(function () { Sons.tocar('nivel'); }, 750);
    });
  }

  function sinal(n) { return (n >= 0 ? '+' : '−') + Math.abs(n).toLocaleString('pt-BR'); }

  function abrirFeedback(t) {
    var p = t.pendente, q = t.questao;
    var fase = CFG.fases[q.fase - 1];
    var linhas = '';
    if (p.acertou) {
      linhas += '<li><span>Acerto (fase ' + fase.n + ')</span><span class="pos">+' + fase.xp + '</span></li>';
      if (p.bonusSeq) linhas += '<li><span>Sequência de acertos 🔥</span><span class="pos">+' + p.bonusSeq + '</span></li>';
      if (p.custo) linhas += '<li><span>Ajuda da Detetive Mediana</span><span class="neg">−' + p.custo + '</span></li>';
    } else if (p.custo && p.ganho < 0) {
      linhas += '<li><span>Ajuda usada em resposta errada</span><span class="neg">' + sinal(p.ganho) + '</span></li>';
    }
    if (p.bonusFase) linhas += '<li><span>Fase concluída ✔</span><span class="pos">+' + p.bonusFase + '</span></li>';
    if (p.bonusVidas) linhas += '<li><span>Vidas restantes (' + p.vidas + ' × ' + CFG.bonus.vida + ')</span><span class="pos">+' + p.bonusVidas + '</span></li>';
    var total = p.ganho + p.bonusFase + p.bonusVidas;
    var fim = t.status !== 'jogando';
    var rotBotao = fim ? 'Ver resultado final →' : p.ultimaDaFase ? 'Concluir a fase →' : '🗺️ Voltar ao mapa';
    abrirModal('<div class="veredito ' + (p.acertou ? 'ok' : 'erro') + '"><span class="carimbo">' + (p.acertou ? 'PISTA CONFIRMADA' : 'PISTA FALSA') + '</span>' +
      '<span><b>' + (p.acertou ? 'Boa! Você acertou.' : 'Não foi dessa vez. Você perdeu uma vida.') + '</b>' + (p.acertou && p.streak >= 2 ? '<br><span class="suave pequeno">🔥 ' + p.streak + ' acertos seguidos</span>' : '') + '</span></div>' +
      '<h3 class="pergunta pequena">' + E(q.pergunta) + '</h3><div id="correcao"></div>' +
      '<div class="explicacao"><h3>Por que essa é a resposta?</h3><p>' + E(p.explicacao) + '</p><span class="pequeno suave">Para revisar: ' + E(p.aula) + '</span></div>' +
      (p.subiuNivel ? '<div class="nivel-up">🎉 Você subiu de nível: ' + E(p.subiuNivel) + '!</div>' : '') +
      '<ul class="xp-detalhe">' + linhas + '<li class="total"><span>XP nesta pista</span><span class="' + (total >= 0 ? 'pos' : 'neg') + '">' + sinal(total) + '</span></li></ul>' +
      '<div class="barra-confirmar"><button class="btn' + (fim || p.ultimaDaFase ? ' ambar' : '') + '" id="proxima">' + rotBotao + '</button></div>');
    Interativos.feedback($('#correcao'), q, p);
    $('#proxima').addEventListener('click', function () { Sons.tocar('clique'); agir(post('/api/proxima')); });
  }

  document.addEventListener('keydown', function (ev) {
    if (modal.hidden || ocupado) return;
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (ev.key === 'Enter') {
      var b = $('#confirmar') || $('#proxima');
      if (b && !b.disabled && !(document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== b)) { ev.preventDefault(); b.click(); }
      return;
    }
    if (controle && controle.teclado(ev)) ev.preventDefault();
  });

  // ---- 5. transição de fase
  function telaTransicao() {
    var t = S.tentativa, tr = t.transicao, c = tr.concluida, px = tr.proxima;
    var cena = Mapa.CENAS[px.n];
    Sons.tocar('fase');
    app.innerHTML = '<div class="estreito"><section class="cartao escuro centro transicao"><div class="carimbo-grande">FASE ' + c.fase.n + ' CONCLUÍDA</div><p class="suave">' + E(c.fase.nome) + ' · ' + E(Mapa.CENAS[c.fase.n].nome) + '</p>' +
      '<div class="placar-final">' +
      '<div class="stat"><b>' + c.acertos + '/' + c.total + '</b><span>acertos</span></div>' +
      '<div class="stat"><b>' + sinal(c.xp) + '</b><span>XP na fase</span></div>' +
      '<div class="stat"><b class="cor-vida">' + '♥'.repeat(t.vidas) + '</b><span>vidas</span></div></div>' +
      (c.itens ? '<p class="pequeno">🧀 Você encontrou ' + c.itens + ' item' + (c.itens > 1 ? 's' : '') + ' bônus nesta sala.</p>' : '') +
      '<p>Você é <b>' + E(t.nivel.nome) + '</b> com ' + t.xp.toLocaleString('pt-BR') + ' XP' + (t.nivel.proximo ? ' · faltam ' + (t.nivel.proximoMin - t.xp).toLocaleString('pt-BR') + ' XP para ' + E(t.nivel.proximo) : '') + '.</p>' +
      '<div class="xp-barra grande"><div style="width:' + t.nivel.pct + '%"></div></div></section>' +
      '<section class="cartao"><h3>Próximo cenário: ' + E(cena.nome) + '</h3>' +
      '<p>Fase ' + px.n + ' · ' + E(px.nome) + ' · dificuldade <b>' + px.rotulo + '</b> · ' + px.qtd + ' pistas · ' + px.xp + ' XP por acerto.</p>' +
      '<div class="mediana">' + Mapa.SVG_MEDIANA + '<div class="balao"><b>Detetive Mediana:</b> ' + (px.n === 4 ? 'O caso final! Três pistas sobre a mesma situação, em ordem. Leia tudo com calma.' : 'As pistas ficam mais traiçoeiras daqui para a frente. Explore a sala: há itens bônus escondidos!') + '</div></div>' +
      '<button class="btn ambar" id="seguir">🚪 Entrar em ' + E(cena.nome) + '</button></section></div>';
    $('#seguir').addEventListener('click', function () { Sons.tocar('abrir'); agir(post('/api/proxima')); });
  }

  // ---- 6. fim
  function telaFim() {
    var t = S.tentativa, r = t.resumo;
    var carimbo = { vitoria: 'CASO RESOLVIDO', gameover: 'CASO ARQUIVADO', tempo: 'TEMPO ESGOTADO' }[r.status];
    var msg = {
      vitoria: 'Parabéns! Você concluiu todas as fases.',
      gameover: 'Suas vidas acabaram. Veja abaixo o que revisar e tente de novo.',
      tempo: 'O tempo da rodada acabou. Veja seu resultado e o que revisar.',
    }[r.status];
    Sons.tocar(r.status === 'vitoria' ? 'vitoria' : r.status === 'gameover' ? 'gameover' : 'alerta');
    var conceitos = r.conceitos.map(function (c) {
      var pct = Math.round((c.acertos / c.total) * 100);
      return '<div class="conceito' + (pct < 100 ? ' fraco' : '') + '"><div class="linha"><span>' + E(c.conceito) + '</span><span>' + c.acertos + '/' + c.total + '</span></div>' +
        '<div class="trilho"><div style="width:' + pct + '%"></div></div>' + (pct < 100 ? '<span class="rev">Revisar: ' + E(c.aula) + '</span>' : '') + '</div>';
    }).join('');
    var erros = r.erros.map(function (e) {
      return '<details class="erro-item"><summary>' + ICO_TIPO[e.tipo] + ' ' + E(e.conceito) + ' · ' + E(e.aula) + '</summary><div class="corpo">' +
        (e.narrativa ? '<p class="suave">' + E(e.narrativa) + '</p>' : '') + '<p><b>' + E(e.pergunta) + '</b></p>' +
        '<p>Sua resposta: <span class="neg">' + E(e.suaResposta) + '</span></p><p>Resposta certa: <span class="pos">' + E(e.resposta) + '</span></p>' +
        '<div class="explicacao">' + E(e.explicacao) + '</div></div></details>';
    }).join('');
    var st = S.rodada.status;
    var podeNova = st === 'ativa' && r.status !== 'tempo';
    app.innerHTML = '<div class="fim-grade">' +
      '<section class="cartao escuro centro fim-topo"><div class="carimbo-grande ' + r.status + '">' + carimbo + '</div><p style="margin:10px 0">' + msg + '</p>' +
      '<div class="xp-final">' + r.xp.toLocaleString('pt-BR') + ' XP</div>' +
      '<div>Nível: <b>' + E(r.nivel.nome) + '</b></div></section>' +
      '<section class="cartao"><div class="placar-final quatro">' +
      '<div class="stat"><b>' + r.acertos + '/' + r.respondidas + '</b><span>acertos</span></div>' +
      (CFG.local ? '<div class="stat"><b>' + S.melhorXp.toLocaleString('pt-BR') + '</b><span>seu recorde (XP)</span></div>' : '<div class="stat"><b>' + (S.posicao || '–') + 'º</b><span>de ' + S.totalAlunos + ' na turma</span></div>') +
      '<div class="stat"><b>' + r.itens + '</b><span>itens bônus</span></div>' +
      '<div class="stat"><b>' + r.ajudas + '</b><span>pistas com ajuda</span></div></div>' +
      Graficos.linhaXp(r.xpHist) + '</section>' +
      '<section class="cartao"><h2>Desempenho por conceito</h2><p class="suave pequeno">Os conceitos em âmbar são os melhores candidatos para revisar antes da prova.</p>' + conceitos + '</section>' +
      (erros ? '<section class="cartao"><h2>Revise o que errou</h2>' + erros + '</section>' : '') +
      '<section class="cartao">' +
      (podeNova ? '<button class="btn ambar" id="nova">🔁 Nova tentativa (pistas sorteadas de novo)</button><p class="suave pequeno centro" style="margin-top:8px">Seu placar guarda a melhor tentativa.</p>' :
        '<p class="centro suave">' + (st === 'encerrada' ? 'A rodada foi encerrada. Obrigado por jogar!' : st === 'pausada' ? 'Rodada pausada pelo professor.' : 'Você pode iniciar uma nova tentativa enquanto a rodada estiver aberta.') + '</p>') +
      '<a href="#" id="trocar" class="centro" style="display:block;margin-top:10px">Trocar conteúdos</a>' +
      (CFG.local ? '<a href="#" id="apagar" class="centro suave pequeno" style="display:block;margin-top:10px">Apagar meu progresso neste aparelho</a>' : '') + '</section></div>';
    var apagar = $('#apagar');
    if (apagar) apagar.addEventListener('click', function (ev) {
      ev.preventDefault();
      if (!confirm('Apagar seu nome, recorde e tentativas salvos neste navegador?')) return;
      window.CasoLocal.apagar();
      sair();
    });
    var nova = $('#nova');
    if (nova) nova.addEventListener('click', function () { Sons.tocar('abrir'); agir(post('/api/iniciar')); });
    $('#trocar').addEventListener('click', function (ev) { ev.preventDefault(); forcarTemas = true; renderizar(true); });
  }

  // ---------------------------------------------------------------- ciclo
  function tick() {
    if (!CFG) return;
    atualizarHud();
    if (!TOKEN || ocupado) return;
    var agora = Date.now();
    var t = S && S.tentativa;
    var jogando = t && t.status === 'jogando';
    var intervalo = jogando ? 10000 : 4000;
    var rest = restanteAgora();
    if (S && S.rodada.status === 'ativa' && rest !== null && rest <= 0 && !pollForcado) { pollForcado = true; ultimoPoll = 0; }
    if (S && S.rodada.status !== 'ativa') pollForcado = false;
    if (agora - ultimoPoll >= intervalo) {
      ultimoPoll = agora;
      atualizar().then(function () { if (!ocupado) renderizar(); }).catch(function (e) { if (e.status === 401) sair(); });
    }
  }

  function iniciar() {
    api('/api/config').then(function (c) {
      CFG = c;
      if (window.CasoLocal) TOKEN = window.CasoLocal.token();
      if (!TOKEN) { renderizar(true); setInterval(tick, 1000); return; }
      return atualizar().catch(function () { TOKEN = null; S = null; }).then(function () { renderizar(true); setInterval(tick, 1000); });
    }).catch(function () {
      app.innerHTML = '<p class="centro erro-msg">Não consegui falar com o servidor. Recarregue a página.</p>';
    });
  }
  iniciar();
})();

</script>
</body>
</html>
